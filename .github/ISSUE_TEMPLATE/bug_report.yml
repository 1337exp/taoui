name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: "@1337exp/taoui version"
      placeholder: "3.2.1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Vue / Nuxt version, browser, OS
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A few lines of template, or a link to a StackBlitz / repository.
      render: vue
