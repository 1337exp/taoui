name: Feature request
description: A component, a prop or a token that is missing
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Describe the task first, the API you imagine second.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed API
      render: vue
