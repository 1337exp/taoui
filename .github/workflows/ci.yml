name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      # the manifest and the type resolution, the way a consumer meets the package
      - run: npm run lint:package
      # installs the packed tarball into a clean Vite project and builds it; prints the cost of one component
      - run: npm run smoke

  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: showcase
      - run: npm run build
        working-directory: showcase
